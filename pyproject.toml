[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hei"
version = "0.1.0"
description = "HCP Engagement Intelligence: causal measurement of pharmaceutical promotion"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
